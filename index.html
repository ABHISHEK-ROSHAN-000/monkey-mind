<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%mm-favicon.svg?v=1" sizes="any" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f4f4f4" />
    <meta name="description" content="Monkey Mind — a space for ideas that don't always follow a straight line. Branding, packaging and creative communication from Mumbai." />
    <title>Monkey Mind — Design Studio</title>
    <style>
      /* Paint the correct base colour before the app stylesheet loads. */
      html { background: #f4f4f4; color-scheme: light; }
      html[data-theme="dark"] { background: #080808; color-scheme: dark; }
    </style>
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('mm-theme');
          var theme = saved === 'light' || saved === 'dark'
            ? saved
            : (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
          document.documentElement.dataset.theme = theme;
          document.documentElement.style.colorScheme = theme;

          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', theme === 'dark' ? '#080808' : '#f4f4f4');

          var icon = document.querySelector('link[rel="icon"]');
          if (icon) {
            var href = icon.getAttribute('href') || '';
            icon.setAttribute('href', href.replace('mm-favicon.svg', theme === 'dark' ? 'mm-favicon-dark.svg' : 'mm-favicon-light.svg'));
          }
        } catch (e) {}
      })();
    </script>
    <link rel="preconnect" href="https://api.fontshare.com" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://api.fontshare.com/v2/css?f[]=archivo@300,400,500,600,700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://api.fontshare.com/v2/css?f[]=clash-display@400,500,600,700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Restore deep link after public/404.html redirect on GitHub Pages
      try {
        var p = sessionStorage.getItem('mm_path');
        if (p) { sessionStorage.removeItem('mm_path'); history.replaceState(null, '', p); }
      } catch (e) {}
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
